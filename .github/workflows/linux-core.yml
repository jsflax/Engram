name: Linux — MemoryCore and Lattice backend

# EngramMemoryCore remains the dependency-free portable memory contract.
# The Linux root graph also retains the existing Lattice backend, its contract
# tests, fixture support and Linux EngramHooks. Execute that graph directly;
# no copied-source package or Apple-only target participates.

on:
  workflow_call:
    secrets:
      SWIFTLM_CLONE_TOKEN:
        required: true
  push:
    branches: [main, "agents/**", "groups/**"]
    paths:
      - "Sources/EngramMemoryCore/**"
      - "Tests/EngramMemoryCoreTests/**"
      - "Tests/Fixtures/ProcessGuard/**"
      - "Sources/EngramMemoryContract/**"
      - "Sources/EngramModels/**"
      - "Sources/EngramLattice/**"
      - "Sources/EngramHooks/**"
      - "Tests/EngramLatticeTests/**"
      - "Tests/EngramTestSupport/**"
      - "Tests/EngramTestSupportTests/**"
      - "SystemLibraries/CEngramLedgerSQLite/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/linux-core.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "Sources/EngramMemoryCore/**"
      - "Tests/EngramMemoryCoreTests/**"
      - "Tests/Fixtures/ProcessGuard/**"
      - "Sources/EngramMemoryContract/**"
      - "Sources/EngramModels/**"
      - "Sources/EngramLattice/**"
      - "Sources/EngramHooks/**"
      - "Tests/EngramLatticeTests/**"
      - "Tests/EngramTestSupport/**"
      - "Tests/EngramTestSupportTests/**"
      - "SystemLibraries/CEngramLedgerSQLite/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/linux-core.yml"
      - ".github/workflows/release.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # Engram requires 6.2; its locked Lattice dependency requires 6.3.
    container: swift:6.3-noble
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SWIFTLM_CLONE_TOKEN }}@github.com/jsflax/SwiftLM.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/jsflax/SwiftLM
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prepare isolated Linux work and output paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_SHA"
          task_root="$HOME/localdev/engram-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 -p "$task_root"/{repo,tmp,fixtures,cache,config,security,module-cache,evidence}
          git -c safe.directory="$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$task_root/repo"
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD^{tree} > "$task_root/evidence/source-tree.txt"
          {
            echo "LINUX_ROOT=$task_root"
            echo "TMPDIR=$task_root/tmp"
            echo "ENGRAM_TEST_TMPDIR=$task_root/tmp"
            echo "ENGRAM_TEST_FIXTURE_ROOT=$task_root/fixtures"
            echo "CLANG_MODULE_CACHE_PATH=$task_root/module-cache"
            echo "SWIFTPM_MODULECACHE_OVERRIDE=$task_root/module-cache"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
          swift --version > "$task_root/evidence/swift-version.txt"
      - name: Install portable test prerequisites
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y python3 libsqlite3-dev pkg-config
          python3 --version
      - name: Record exact root Linux source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY_SOURCE'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ['LINUX_ROOT'])
          repository = root / 'repo'
          source_sha = os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', source_sha)
          directories = (
              'Sources/EngramMemoryCore', 'Sources/EngramMemoryContract',
              'Sources/EngramModels', 'Sources/EngramLattice', 'Sources/EngramHooks',
              'Tests/Fixtures/ProcessGuard', 'Tests/EngramMemoryCoreTests',
              'Tests/EngramLatticeTests', 'Tests/EngramTestSupport',
              'Tests/EngramTestSupportTests', 'SystemLibraries/CEngramLedgerSQLite',
          )
          files = [repository / name for name in
                   ('Package.swift', 'Package.resolved', '.github/workflows/linux-core.yml')]
          for relative in directories:
              directory = repository / relative
              assert directory.is_dir() and not directory.is_symlink(), relative
              for path in sorted(directory.rglob('*')):
                  assert not path.is_symlink(), str(path)
                  if path.is_file():
                      files.append(path)
          hashes = {}
          for path in files:
              assert path.is_file() and not path.is_symlink(), str(path)
              hashes[path.relative_to(repository).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          identity = {
              'source_root': str(repository), 'source_sha': source_sha,
              'source_tree': (root / 'evidence/source-tree.txt').read_text().strip(),
              'files_sha256': hashes,
              'manifest_sha256': hashes['Package.swift'],
              'resolved_sha256': hashes['Package.resolved'],
              'execution_root': 'original archived root package; no staged source package',
          }
          (root / 'evidence/source-identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY_SOURCE
      - name: Build EngramMemoryCore (Linux)
        run: |
          swift build --package-path "$LINUX_ROOT/repo" --scratch-path "$LINUX_ROOT/root-build" \
            --cache-path "$LINUX_ROOT/cache" --config-path "$LINUX_ROOT/config" --security-path "$LINUX_ROOT/security" \
            --force-resolved-versions --target EngramMemoryCore
      - name: Compile its tests (Linux)
        run: |
          swift build --package-path "$LINUX_ROOT/repo" --scratch-path "$LINUX_ROOT/root-build" \
            --cache-path "$LINUX_ROOT/cache" --config-path "$LINUX_ROOT/config" --security-path "$LINUX_ROOT/security" \
            --force-resolved-versions --target EngramMemoryCoreTests
      - name: Execute root memory and backend tests (Linux)
        shell: bash
        run: |
          set -euo pipefail
          guard_bin="$(swift build --package-path "$LINUX_ROOT/repo" --scratch-path "$LINUX_ROOT/root-build" \
            --cache-path "$LINUX_ROOT/cache" --config-path "$LINUX_ROOT/config" --security-path "$LINUX_ROOT/security" \
            --force-resolved-versions --show-bin-path)/EngramProcessGuardFixture"
          export ENGRAM_TEST_PROCESS_GUARD="$guard_bin"
          swift test --package-path "$LINUX_ROOT/repo" --scratch-path "$LINUX_ROOT/root-build" \
            --cache-path "$LINUX_ROOT/cache" --config-path "$LINUX_ROOT/config" --security-path "$LINUX_ROOT/security" \
            --force-resolved-versions --no-parallel 2>&1 | tee "$LINUX_ROOT/evidence/root-tests.log"
          python3 -B - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ['LINUX_ROOT'])
          output = (root / 'evidence/root-tests.log').read_text()
          output = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', output)
          required = {
              'detachedShellOwnsLeaseUntilProviderExitEvenWhenProviderClosesFD',
              'unavailableAndSaturatedLoadRefuseWithoutCooldown',
              'overridesCannotOutliveRegisteredHostOrWatchdog',
              'exactReapedNormalAndSignalStatuses',
              'queuedCancellationDoesNotCreateProvider',
              'deadlineReapsProviderAfterItMovesProcessGroup',
              'timeoutReapsTermIgnoringProviderBeforeReleasingLease',
              'cancellationEscalatesWithoutDroppingProviderLease',
              'wrapperDeathAndProviderFDClosureDoNotReleaseGuardLease',
              'contractHoldsOnLattice',
          }
          passed = set(re.findall(r'^✔ Test (\w+)\(\) passed after ', output, re.M))
          assert required <= passed, f'Missing required runtime passes: {required - passed}'
          assert re.search(r'^✔ Test run with [1-9]\d* tests? .*passed after ', output, re.M)
          assert not re.search(r'^.*(?:Test|Suite) .+ (?:failed|skipped)\b', output, re.M)
          PY
      - name: Upload root Linux qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.LINUX_ROOT }}/evidence/
          if-no-files-found: error
