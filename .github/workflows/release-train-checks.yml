name: Release train checks

on:
  pull_request:
    paths: ['release-train/**', '.github/workflows/**', 'scripts/release.sh', 'scripts/test_codex_release_workflow.py']
  push:
    branches: [main]
    paths: ['release-train/**', '.github/workflows/**', 'scripts/release.sh', 'scripts/test_codex_release_workflow.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release protocol regression tests (no native build)
        run: python3 -m unittest discover -s release-train -p 'test_*.py'
      - name: Workflow command contracts (no native build)
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$HOME/localdev/engram-workflow-contracts-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -m 700 -p "$fixture_root/tmp"
          TMPDIR="$fixture_root/tmp" PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest discover -s scripts -p 'test_codex_release_workflow.py' -v \
            2>&1 | tee "$fixture_root/workflow-tests.log"
      - name: Python syntax and policy
        run: |
          python3 -m py_compile release-train/release_train.py
          python3 -m json.tool release-train/policy.json > /dev/null
