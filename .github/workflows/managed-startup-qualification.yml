name: Current exact23 owned-catalog SDK qualification

on:
  workflow_dispatch:
    inputs:
      coherent_source_qualification:
        description: 'Fresh matched SDK/Bridge compilation and exact23 catalog case invocations; finite SDK scope'
        type: boolean
        required: true
        default: false
      input_artifact_id:
        description: 'Actual lattice-owner-build-inputs-v1 artifact ID'
        type: string
        required: true
      input_producer_run_id:
        description: 'Actual producing run ID of that exact artifact'
        type: string
        required: true
      input_archive_sha256:
        description: 'Independently verified downloaded Actions ZIP SHA256'
        type: string
        required: true
      input_payload_sha256:
        description: 'Exact single raw lattice-owner-build-inputs-v1.zip SHA256'
        type: string
        required: true
      input_payload_bytes:
        description: 'Exact raw payload bytes, positive and at most2147483648'
        type: string
        required: true
      source_graph_seal_sha256:
        description: 'Exact corrected source graph; no old-artifact retarget'
        type: string
        required: true
      required_sources_sha256:
        description: 'Exact corresponding changed required-source seal'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  coherent-source:
    if: inputs.coherent_source_qualification == true
    runs-on: macos-26
    timeout-minutes: 235
    strategy:
      fail-fast: false
      matrix:
        qualification_kind: [sdk-catalog]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ENGRAM_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QUALIFICATION_KIND: ${{ matrix.qualification_kind }}
      INPUT_ARTIFACT: ${{ inputs.input_artifact_id }}
      INPUT_PRODUCER: ${{ inputs.input_producer_run_id }}
      INPUT_ARCHIVE_SHA: ${{ inputs.input_archive_sha256 }}
      INPUT_PAYLOAD_SHA: ${{ inputs.input_payload_sha256 }}
      INPUT_PAYLOAD_BYTES: ${{ inputs.input_payload_bytes }}
      INPUT_GRAPH_SHA: ${{ inputs.source_graph_seal_sha256 }}
      INPUT_REQUIRED_SHA: ${{ inputs.required_sources_sha256 }}
    steps:
      - name: Own exact caller and bounded source inputs under localdev
        timeout-minutes: 15
        shell: bash
        env:
          BOOTSTRAP_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = jsflax/Engram
          test "$RUNNER_OS" = macOS
          test "$ENGRAM_WORKFLOW_SHA" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_ARTIFACT" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$INPUT_PRODUCER" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$INPUT_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$INPUT_PAYLOAD_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$INPUT_PAYLOAD_BYTES" =~ ^[1-9][0-9]{0,9}$ ]]
          test "$INPUT_PAYLOAD_BYTES" -le 2147483648
          test "$INPUT_GRAPH_SHA" = e8ff9f5a9f9115c371d3de0a23128607784438fad61e7a7e5d5aabd13300cab2
          test "$INPUT_REQUIRED_SHA" = a92ee9d0de143bf3a07d0919f9dca885a2e89621d5af521bc40f5d0a3fb66538
          umask 077
          if test ! -e "$HOME/localdev" && test ! -L "$HOME/localdev"; then
            mkdir -m 0711 "$HOME/localdev"
          fi
          test -d "$HOME/localdev"
          test ! -L "$HOME/localdev"
          COHERENT_NAMESPACE="$HOME/localdev/coherent-source-${GITHUB_RUN_ID}-${QUALIFICATION_KIND}"
          test ! -e "$COHERENT_NAMESPACE"
          test ! -L "$COHERENT_NAMESPACE"
          mkdir -m 0700 "$COHERENT_NAMESPACE"
          mkdir "$COHERENT_NAMESPACE/bootstrap" "$COHERENT_NAMESPACE/tmp"
          printf 'COHERENT_NAMESPACE=%s\n' "$COHERENT_NAMESPACE" >> "$GITHUB_ENV"
          export TMPDIR="$COHERENT_NAMESPACE/tmp"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init "$COHERENT_NAMESPACE/harness" > "$COHERENT_NAMESPACE/bootstrap/checkout.log" 2>&1
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$BOOTSTRAP_TOKEN" | base64 | tr -d '\n')"
          git -c core.hooksPath=/dev/null -C "$COHERENT_NAMESPACE/harness" fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA" >> "$COHERENT_NAMESPACE/bootstrap/checkout.log" 2>&1
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git -c core.hooksPath=/dev/null -C "$COHERENT_NAMESPACE/harness" checkout --detach "$GITHUB_SHA" >> "$COHERENT_NAMESPACE/bootstrap/checkout.log" 2>&1
          test "$(git -C "$COHERENT_NAMESPACE/harness" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$COHERENT_NAMESPACE/harness" status --porcelain)"
          test "$(shasum -a 256 "$COHERENT_NAMESPACE/harness/scripts/prepare_hosted_owner_build_inputs.py" | cut -d ' ' -f1)" = cdcfa72303cbc0e65d375d145cdaf01074e90f1fa65162070e82a4758f0d42ff
          test "$(shasum -a 256 "$COHERENT_NAMESPACE/harness/scripts/prepare_hosted_owner_inputs.py" | cut -d ' ' -f1)" = 898584cde6aff6764c089899e77dc51a59a57872d2d1f3933782bf88647d91a6
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 1048576 \
            -H "Authorization: Bearer $BOOTSTRAP_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${INPUT_ARTIFACT}" -o "$COHERENT_NAMESPACE/bootstrap/artifact.json"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 180 --max-filesize 2147483648 \
            -H "Authorization: Bearer $BOOTSTRAP_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${INPUT_ARTIFACT}/zip" -o "$COHERENT_NAMESPACE/bootstrap/inputs.zip"
          unset BOOTSTRAP_TOKEN
          COHERENT_PYTHON="$(command -v python3)"
          "$COHERENT_PYTHON" -I -S -B "$COHERENT_NAMESPACE/harness/scripts/prepare_hosted_owner_build_inputs.py" prepare \
            --metadata "$COHERENT_NAMESPACE/bootstrap/artifact.json" --archive "$COHERENT_NAMESPACE/bootstrap/inputs.zip" \
            --archive-sha256 "$INPUT_ARCHIVE_SHA" --payload-sha256 "$INPUT_PAYLOAD_SHA" --payload-bytes "$INPUT_PAYLOAD_BYTES" \
            --artifact-id "$INPUT_ARTIFACT" --producer-run-id "$INPUT_PRODUCER" \
            --graph-seal-sha256 "$INPUT_GRAPH_SHA" --required-sha256 "$INPUT_REQUIRED_SHA" \
            --root "$COHERENT_NAMESPACE/inputs" --github-env "$GITHUB_ENV" > "$COHERENT_NAMESPACE/bootstrap/inputs.log" 2>&1
          printf 'COHERENT_PYTHON=%s\n' "$COHERENT_PYTHON" >> "$GITHUB_ENV"

      - name: Build matched SDK/Bridge and run exact catalog callback population
        timeout-minutes: 215
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          TAG="$("$COHERENT_PYTHON" -I -S -B -c 'import uuid; print(uuid.uuid4().hex[:8])')"
          COHERENT_WORK_ROOT="$HOME/localdev/lqc${TAG}"
          COHERENT_DEVELOPER_RAW="$(xcode-select -p)"
          COHERENT_SDK_RAW="$(xcrun --sdk macosx --show-sdk-path)"
          COHERENT_CMAKE_RAW="$(command -v cmake)"
          COHERENT_DEVELOPER="$("$COHERENT_PYTHON" -I -S -B -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=True))' "$COHERENT_DEVELOPER_RAW")"
          COHERENT_SDK="$("$COHERENT_PYTHON" -I -S -B -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=True))' "$COHERENT_SDK_RAW")"
          COHERENT_CMAKE="$("$COHERENT_PYTHON" -I -S -B -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=True))' "$COHERENT_CMAKE_RAW")"
          printf 'developer=%s\ncanonicalDeveloper=%s\nsdk=%s\ncanonicalSDK=%s\ncmake=%s\ncanonicalCMake=%s\n' \
            "$COHERENT_DEVELOPER_RAW" "$COHERENT_DEVELOPER" "$COHERENT_SDK_RAW" "$COHERENT_SDK" \
            "$COHERENT_CMAKE_RAW" "$COHERENT_CMAKE" > "$COHERENT_NAMESPACE/bootstrap/tool-paths.log"
          # This SDK test compiler and its receipt use an original fresh root.
          # No profile, account, provider, source stamp or product image is run.
          set +e
          "$COHERENT_PYTHON" -I -S -B "$COHERENT_NAMESPACE/harness/scripts/qualify_hosted_owned_catalog_sdk.py" \
            --ephemeral-ci-vm --kind "$QUALIFICATION_KIND" --graph "$OWNER_BUILD_INPUT_ROOT/graph" \
            --graph-pins "$OWNER_BUILD_INPUT_ROOT/SOURCE-GRAPH-SEAL.json" --graph-pins-sha256 "$OWNER_BUILD_GRAPHSEALSHA256" \
            --required-sources "$OWNER_BUILD_INPUT_ROOT/OWNER-DEPENDENCIES.json" --required-sources-sha256 "$OWNER_BUILD_REQUIREDSHA256" \
            --cache "$OWNER_BUILD_INPUT_ROOT/dependency-cache" --cache-pins "$OWNER_BUILD_INPUT_ROOT/CACHE-SEAL.json" --cache-pins-sha256 "$OWNER_BUILD_CACHESEALSHA256" \
            --config "$OWNER_BUILD_INPUT_ROOT/dependency-config" --config-pins "$OWNER_BUILD_INPUT_ROOT/CONFIG-SEAL.json" --config-pins-sha256 "$OWNER_BUILD_CONFIGSEALSHA256" \
            --owner-lock "$OWNER_BUILD_INPUT_ROOT/OwnerImages.Package.resolved" --root "$COHERENT_WORK_ROOT" \
            --evidence "$COHERENT_NAMESPACE/evidence" --cmake "$COHERENT_CMAKE" --developer-dir "$COHERENT_DEVELOPER" \
            --sdk-root "$COHERENT_SDK" --harness-commit "$GITHUB_SHA" > "$COHERENT_NAMESPACE/bootstrap/qualification.log" 2>&1
          QUALIFICATION_EXIT=$?
          set -e
          printf '%s\n' "$QUALIFICATION_EXIT" > "$COHERENT_NAMESPACE/qualification-exit.status"
          test "$QUALIFICATION_EXIT" -eq 0

      - name: Retain bounded first outcomes without stores or build trees
        if: always() && env.COHERENT_NAMESPACE != ''
        uses: actions/upload-artifact@v4
        with:
          name: coherent-source-${{ matrix.qualification_kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.COHERENT_NAMESPACE }}/bootstrap/*.log
            ${{ env.COHERENT_NAMESPACE }}/qualification-exit.status
            ${{ env.COHERENT_NAMESPACE }}/evidence/**
          if-no-files-found: warn
          retention-days: 14
