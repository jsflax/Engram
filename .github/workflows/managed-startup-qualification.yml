name: Qualify real legacy memory and seeded startup hook

on:
  workflow_dispatch:
    inputs:
      mcp_role_gate:
        description: 'Run real seeded memory MCP and startup hook with live FD samples and original lifetimes on a fresh hosted Mac'
        type: boolean
        required: true
        default: false
      image_build_gate:
        description: 'Must remain false; image builds use their separate unchanged workflow'
        type: boolean
        required: true
        default: false
      input_artifact_id:
        description: 'Actual graph031 lattice-owner-build-inputs-v1 artifact ID'
        type: string
        required: true
      input_producer_run_id:
        description: 'Actual producer run of that source-input artifact'
        type: string
        required: true
      input_archive_sha256:
        description: 'Independent SHA256 of the downloaded source-input outer ZIP'
        type: string
        required: true
      input_payload_sha256:
        description: 'Independent SHA256 of its single raw lattice-owner-build-inputs-v1.zip payload'
        type: string
        required: true
      input_payload_bytes:
        description: 'Exact source-input raw payload bytes, positive and <=2147483648'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  one-real-memory-mcp-role:
    if: inputs.mcp_role_gate == true || inputs.image_build_gate == true
    runs-on: macos-26
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ENGRAM_WORKFLOW_SHA: ${{ github.workflow_sha }}
      MCP_ROLE_GATE: ${{ inputs.mcp_role_gate }}
      IMAGE_BUILD_GATE: ${{ inputs.image_build_gate }}
      INPUT_ARTIFACT: ${{ inputs.input_artifact_id }}
      INPUT_PRODUCER: ${{ inputs.input_producer_run_id }}
      INPUT_ARCHIVE_SHA: ${{ inputs.input_archive_sha256 }}
      INPUT_PAYLOAD_SHA: ${{ inputs.input_payload_sha256 }}
      INPUT_PAYLOAD_BYTES: ${{ inputs.input_payload_bytes }}
    steps:
      - name: Bind actual first dispatch and exact hook-start source inputs under localdev
        timeout-minutes: 15
        shell: bash
        env:
          BOOTSTRAP_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$MCP_ROLE_GATE" = true
          test "$IMAGE_BUILD_GATE" = false
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = jsflax/Engram
          test "$RUNNER_OS" = macOS
          test "$(uname -m)" = arm64
          test "$ENGRAM_WORKFLOW_SHA" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_ARTIFACT" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$INPUT_PRODUCER" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$INPUT_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$INPUT_PAYLOAD_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$INPUT_PAYLOAD_BYTES" =~ ^[1-9][0-9]{0,9}$ ]]
          test "$INPUT_PAYLOAD_BYTES" -le 2147483648
          umask 077
          if test ! -e "$HOME/localdev" && test ! -L "$HOME/localdev"; then
            mkdir -m 0711 "$HOME/localdev"
          fi
          test -d "$HOME/localdev"
          test ! -L "$HOME/localdev"
          OWNER_MCP_NAMESPACE="$HOME/localdev/legacy-mcp-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$OWNER_MCP_NAMESPACE"
          test ! -L "$OWNER_MCP_NAMESPACE"
          mkdir -m 0700 "$OWNER_MCP_NAMESPACE"
          printf 'OWNER_MCP_NAMESPACE=%s\n' "$OWNER_MCP_NAMESPACE" >> "$GITHUB_ENV"
          mkdir "$OWNER_MCP_NAMESPACE/bootstrap" "$OWNER_MCP_NAMESPACE/tmp"
          export TMPDIR="$OWNER_MCP_NAMESPACE/tmp"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init "$OWNER_MCP_NAMESPACE/harness" > "$OWNER_MCP_NAMESPACE/bootstrap/checkout.log" 2>&1
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$BOOTSTRAP_TOKEN" | base64 | tr -d '\n')"
          git -c core.hooksPath=/dev/null -C "$OWNER_MCP_NAMESPACE/harness" fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA" >> "$OWNER_MCP_NAMESPACE/bootstrap/checkout.log" 2>&1
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git -c core.hooksPath=/dev/null -C "$OWNER_MCP_NAMESPACE/harness" checkout --detach "$GITHUB_SHA" >> "$OWNER_MCP_NAMESPACE/bootstrap/checkout.log" 2>&1
          test "$(git -C "$OWNER_MCP_NAMESPACE/harness" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$OWNER_MCP_NAMESPACE/harness" status --porcelain)"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 1048576 \
            -H "Authorization: Bearer $BOOTSTRAP_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${INPUT_ARTIFACT}" -o "$OWNER_MCP_NAMESPACE/bootstrap/source-artifact.json"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 180 --max-filesize 2147483648 \
            -H "Authorization: Bearer $BOOTSTRAP_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${INPUT_ARTIFACT}/zip" -o "$OWNER_MCP_NAMESPACE/bootstrap/source-inputs.zip"
          unset BOOTSTRAP_TOKEN
          OWNER_PYTHON="$(command -v python3)"
          "$OWNER_PYTHON" -I -S -B "$OWNER_MCP_NAMESPACE/harness/scripts/prepare_hosted_owner_build_inputs.py" prepare \
            --metadata "$OWNER_MCP_NAMESPACE/bootstrap/source-artifact.json" --archive "$OWNER_MCP_NAMESPACE/bootstrap/source-inputs.zip" \
            --archive-sha256 "$INPUT_ARCHIVE_SHA" --payload-sha256 "$INPUT_PAYLOAD_SHA" --payload-bytes "$INPUT_PAYLOAD_BYTES" \
            --artifact-id "$INPUT_ARTIFACT" --producer-run-id "$INPUT_PRODUCER" \
            --graph-seal-sha256 4eedc08eb9f202fde117bda3ccff82b1ff4a110701bd688318194e646d482239 \
            --required-sha256 8e5910358c54ff03e4e383a3b1332fbece6456413d1f1048761f787edeab5279 \
            --root "$OWNER_MCP_NAMESPACE/source-inputs" --github-env "$GITHUB_ENV" \
            > "$OWNER_MCP_NAMESPACE/bootstrap/source-validation.log" 2>&1
          printf 'OWNER_PYTHON=%s\n' "$OWNER_PYTHON" >> "$GITHUB_ENV"

      - name: Retain and bind the exact actual graph030 signed app artifact as DATA
        timeout-minutes: 5
        shell: bash
        env:
          ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export TMPDIR="$OWNER_MCP_NAMESPACE/tmp"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 1048576 \
            -H "Authorization: Bearer $ARTIFACT_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/jsflax/Engram/actions/artifacts/11954047235" -o "$OWNER_MCP_NAMESPACE/bootstrap/legacy-artifact.json"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 180 --max-filesize 167333147 \
            -H "Authorization: Bearer $ARTIFACT_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/jsflax/Engram/actions/artifacts/11954047235/zip" -o "$OWNER_MCP_NAMESPACE/bootstrap/legacy-images.zip"
          unset ARTIFACT_TOKEN
          "$OWNER_PYTHON" -I -S -B "$OWNER_MCP_NAMESPACE/harness/scripts/prepare_hosted_legacy_mcp_inputs.py" \
            --graph "$OWNER_BUILD_INPUT_ROOT/graph" --graph-pins "$OWNER_BUILD_INPUT_ROOT/SOURCE-GRAPH-SEAL.json" \
            --required "$OWNER_BUILD_INPUT_ROOT/OWNER-DEPENDENCIES.json" \
            --metadata "$OWNER_MCP_NAMESPACE/bootstrap/legacy-artifact.json" --archive "$OWNER_MCP_NAMESPACE/bootstrap/legacy-images.zip" \
            --root "$OWNER_MCP_NAMESPACE/legacy-images" --github-env "$GITHUB_ENV" \
            > "$OWNER_MCP_NAMESPACE/bootstrap/legacy-input-validation.log" 2>&1

      - name: Run genuine seeded MCP and startup hook with original command custody and 600 second budget
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          export TMPDIR="$OWNER_MCP_NAMESPACE/tmp"
          OWNER_MCP_ROOT="$HOME/localdev/lqm$("$OWNER_PYTHON" -I -S -B -c 'import uuid;print(uuid.uuid4().hex[:8])')"
          test ! -e "$OWNER_MCP_ROOT"
          test ! -L "$OWNER_MCP_ROOT"
          printf 'OWNER_MCP_ROOT=%s\n' "$OWNER_MCP_ROOT" >> "$GITHUB_ENV"
          OWNER_CMAKE_RAW="$(command -v cmake)"
          OWNER_DEVELOPER_RAW="$(xcode-select -p)"
          OWNER_SDK_RAW="$(xcrun --sdk macosx --show-sdk-path)"
          OWNER_CMAKE="$("$OWNER_PYTHON" -I -S -B -c 'from pathlib import Path;import sys;print(Path(sys.argv[1]).resolve(strict=True))' "$OWNER_CMAKE_RAW")"
          OWNER_DEVELOPER="$("$OWNER_PYTHON" -I -S -B -c 'from pathlib import Path;import sys;print(Path(sys.argv[1]).resolve(strict=True))' "$OWNER_DEVELOPER_RAW")"
          OWNER_SDK="$("$OWNER_PYTHON" -I -S -B -c 'from pathlib import Path;import sys;print(Path(sys.argv[1]).resolve(strict=True))' "$OWNER_SDK_RAW")"
          printf 'cmake_raw=%s\ncmake_resolved=%s\ndeveloper_raw=%s\ndeveloper_resolved=%s\nsdk_raw=%s\nsdk_resolved=%s\n' \
            "$OWNER_CMAKE_RAW" "$OWNER_CMAKE" "$OWNER_DEVELOPER_RAW" "$OWNER_DEVELOPER" "$OWNER_SDK_RAW" "$OWNER_SDK" \
            > "$OWNER_MCP_NAMESPACE/bootstrap/toolchain-inputs.log"
          test "$(wc -c < "$OWNER_MCP_NAMESPACE/bootstrap/toolchain-inputs.log")" -le 32768
          set +e
          "$OWNER_PYTHON" -I -S -B "$OWNER_BUILD_INPUT_ROOT/graph/FixtureScripts/observe_hosted_legacy_mcp.py" \
            --ephemeral-ci-vm --graph "$OWNER_BUILD_INPUT_ROOT/graph" \
            --graph-pins "$OWNER_BUILD_INPUT_ROOT/SOURCE-GRAPH-SEAL.json" \
            --graph-pins-sha256 4eedc08eb9f202fde117bda3ccff82b1ff4a110701bd688318194e646d482239 \
            --harness-commit "$GITHUB_SHA" --root "$OWNER_MCP_ROOT" \
            --legacy-build "$MCP_LEGACY_BUILD" --legacy-build-sha256 "$MCP_LEGACY_BUILD_SHA" \
            --legacy-producer-exit "$MCP_LEGACY_PRODUCER_EXIT" \
            --legacy-build-only "$MCP_LEGACY_BUILD_ONLY" --legacy-build-only-sha256 "$MCP_LEGACY_BUILD_ONLY_SHA" \
            --legacy-app-archive "$MCP_LEGACY_APP_ARCHIVE" --legacy-app-archive-sha256 "$MCP_LEGACY_APP_ARCHIVE_SHA" \
            --legacy-app-archive-bytes "$MCP_LEGACY_APP_ARCHIVE_BYTES" \
            --hook-on-start \
            --cmake "$OWNER_CMAKE" --developer-dir "$OWNER_DEVELOPER" --sdk-root "$OWNER_SDK" \
            > "$OWNER_MCP_NAMESPACE/bootstrap/mcp-role.log" 2>&1
          MCP_EXIT=$?
          set -e
          printf '%s\n' "$MCP_EXIT" > "$OWNER_MCP_NAMESPACE/mcp-producer-exit.status"
          test "$MCP_EXIT" -eq 0

      - name: Preserve actual first role outcome and bounded command evidence
        if: always() && env.OWNER_MCP_NAMESPACE != ''
        uses: actions/upload-artifact@v4
        with:
          name: legacy-memory-mcp-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OWNER_MCP_NAMESPACE }}/bootstrap/*.log
            ${{ env.OWNER_MCP_NAMESPACE }}/bootstrap/*.json
            ${{ env.OWNER_MCP_NAMESPACE }}/mcp-producer-exit.status
            ${{ env.OWNER_MCP_NAMESPACE }}/legacy-images/IMAGE-INPUT.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve actual retained role receipts only after its root was named
        if: always() && env.OWNER_MCP_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: legacy-memory-mcp-role-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OWNER_MCP_ROOT }}/ROLE.json
            ${{ env.OWNER_MCP_ROOT }}/EXTRACTED-LEGACY-APP.json
            ${{ env.OWNER_MCP_ROOT }}/legacy-mcp-fd.json
            ${{ env.OWNER_MCP_ROOT }}/hook-start-fd.json
            ${{ env.OWNER_MCP_ROOT }}/receipts/**
            ${{ env.OWNER_MCP_ROOT }}/negative-receipts/**
            ${{ env.OWNER_MCP_ROOT }}/private/**
            ${{ env.OWNER_MCP_ROOT }}/negative-private/**
          if-no-files-found: warn
          retention-days: 14
