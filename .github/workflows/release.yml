name: Release
run-name: Release ${{ inputs.version || github.ref_name }} at ${{ inputs.expected_sha || github.sha }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit SemVer version without a v prefix'
        required: true
        type: string
      expected_sha:
        description: 'Exact main commit (full 40-character SHA)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  RELEASE_VERSION_INPUT: ${{ inputs.version }}
  EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact candidate and published dependency pins
        id: candidate
        run: |
          VERSION="${RELEASE_VERSION_INPUT:-${GITHUB_REF_NAME#v}}"
          python3 release-train/release_train.py check --version "$VERSION" --expected-sha "$EXPECTED_SHA"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Require complete signed distribution credentials
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SWIFTLM: ${{ secrets.SWIFTLM_CLONE_TOKEN }}
        run: |
          for key in CERT CERT_PASSWORD TEAM APPLE_ID APPLE_PASSWORD SPARKLE SWIFTLM; do
            if [ -z "${!key}" ]; then echo "::error::Required release credential unavailable: $key"; exit 1; fi
          done
  portable:
    needs: preflight
    uses: ./.github/workflows/linux-core.yml
    secrets:
      SWIFTLM_CLONE_TOKEN: ${{ secrets.SWIFTLM_CLONE_TOKEN }}
  build:
    needs: [preflight, portable]
    runs-on: macos-26
    # SwiftLM is a private dependency (since the mascot-chat work) — SwiftPM
    # resolution needs a token. SWIFTLM_CLONE_TOKEN: fine-grained PAT, read-only
    # Contents on jsflax/SwiftLM. Scoped insteadOf so no other clone is touched.
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SWIFTLM_CLONE_TOKEN }}@github.com/jsflax/SwiftLM.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/jsflax/SwiftLM
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SwiftPM's URLSession-based binary-artifact download of the Sparkle
      # zip hangs DETERMINISTICALLY on this runner image (6/6 alarm-killed
      # attempts across two runs; pre-populating .build/artifacts was
      # ignored — SwiftPM insists on downloading). curl fetches the same URL
      # instantly, so: fetch it ourselves, serve it from localhost, and
      # mirror the artifact URL there (mirrors apply to binary-target URLs;
      # identical bytes keep the manifest checksum valid).
      - name: Mirror Sparkle artifact from localhost
        timeout-minutes: 5
        run: |
          curl -sSfL -o /tmp/sparkle-mirror-root/Sparkle-for-Swift-Package-Manager.zip --create-dirs \
            https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-for-Swift-Package-Manager.zip
          (cd /tmp/sparkle-mirror-root && nohup python3 -m http.server 8765 > /tmp/mirror.log 2>&1 &)
          sleep 2
          curl -sSf -o /dev/null http://127.0.0.1:8765/Sparkle-for-Swift-Package-Manager.zip && echo "mirror serving OK"
          swift package config set-mirror \
            --original https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-for-Swift-Package-Manager.zip \
            --mirror http://127.0.0.1:8765/Sparkle-for-Swift-Package-Manager.zip
          cat .swiftpm/configuration/mirrors.json

      # Resolution (dependency clones) — still isolated with a hard
      # per-attempt kill so any OTHER stuck fetch costs 8 minutes, not 90.
      - name: Resolve dependencies
        timeout-minutes: 30
        run: |
          for attempt in 1 2 3; do
            if perl -e 'alarm(8*60); exec @ARGV' -- swift package resolve; then
              exit 0
            fi
            echo "::warning::resolve attempt ${attempt} failed or hung - retrying"
          done
          exit 1

      # Compile-only after a clean resolve; generous budget for the cold
      # C++-heavy graph on slow hosted runners.
      - name: Build tests
        timeout-minutes: 75
        run: swift build --build-tests
      # Core correctness gate (the 0.13.0 release bar): sync/memory/organize/
      # relay + RealityKit system tests. EngramVisualizerTests' GPU-internal
      # suites are known debt (see CHANGELOG 0.13.0) and on-device
      # FoundationModels tests can't run on hosted runners.
      # Environment-sensitive tests are excluded on hosted runners (they
      # remain local gates): the ENTIRE PerfTests suite (idle-machine latency
      # budgets — different borderline tests fail on different runs of the
      # slow shared runners) and the documented model-marginal / design-
      # tension recall assertions from the revival. ~345 correctness tests
      # remain as the release bar.
      - name: Run tests
        timeout-minutes: 30
        run: >
          swift test --skip-build --filter "EngramTests|EngramMemoryCoreTests|EngramRealityKitTests|PositionVersionTests"
          --skip "PerfTests"
          --skip "keyBERTKeywordExtraction"
          --skip "recall_semanticRelevanceOrdering"
          --skip "recall_connectedMemory_showsEdgeRelation"
          --skip "recall_graphTraversal_relatesToDoesNotLeakViaUnrelatedStructuralEdge"
          --skip "recall_statementBudget"
          --skip "clusters_statementBudget"

      # Statement-budget regressions read the process-global SQL statement
      # counter; suites running in parallel pollute every measurement window
      # (sustained, not bursty — min-of-N can't rescue it). They run alone in
      # a quiet invocation instead.
      #
      # Both budget tests must be here, and must run in ONE invocation each
      # other's absence: the clustering budget test issues thousands of
      # statements by design, so leaving it in the parallel run drove
      # recall_statementBudget to 698 against its 180 pin — a failure that
      # looks exactly like a recall regression and isn't one.
      - name: Run statement-budget regressions (serial)
        timeout-minutes: 10
        run: |
          swift test --skip-build --filter "recall_statementBudget"
          swift test --skip-build --filter "clusters_statementBudget"

      - name: Validate performance report parser
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_profile*.py'

      - name: Validate Codex session learner and installers
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_codex*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_codex*.py'

      - name: Validate portable Codex plugin packaging
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_package_codex_plugin.py'

      - name: Validate packaged Codex plugin hooks and learner
        run: python3 -B Tests/codex_plugin/run_suite.py

      - name: Build CLI release binaries
        run: swift build -c release

      - name: Verify real MCP lifecycle and database lock regressions
        timeout-minutes: 10
        run: |
          mkdir -p build/mcp-test-home build/mcp-test-tmp
          for regression in smoke startup recall idle; do
            env HOME="$PWD/build/mcp-test-home" \
              CFFIXED_USER_HOME="$PWD/build/mcp-test-home" \
              TMPDIR="$PWD/build/mcp-test-tmp" \
              python3 -B scripts/verify-mcp-locks.py \
                --binary .build/release/Engram --case "$regression"
          done

      - name: Import signing certificate
        if: env.DEVELOPER_ID_CERT_BASE64 != ''
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$DEVELOPER_ID_CERT_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      # -clonedSourcePackagesDirPath .build reuses the CLI-resolved package
      # checkouts AND the mirror-fetched Sparkle artifact — Xcode's own
      # package resolution (which re-downloads binary artifacts with the
      # same hanging URLSession path) never runs.
      - name: Archive app with xcodebuild
        timeout-minutes: 60
        if: env.DEVELOPER_ID_CERT_BASE64 != ''
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=${RELEASE_TAG#v}
          PREV_BUILD=$(sed -n 's/.*<sparkle:version>\([0-9]*\)<.*/\1/p' appcast.xml | head -1)
          BUILD_NUMBER=$(( ${PREV_BUILD:-0} + 1 ))
          xcodebuild archive \
            -project Engram.xcodeproj \
            -clonedSourcePackagesDirPath .build \
            -scheme Engram \
            -archivePath build/Engram.xcarchive \
            -configuration Release \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="${VERSION%%-*}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db"

      - name: Export archive to .app
        if: env.DEVELOPER_ID_CERT_BASE64 != ''
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Inject team ID into ExportOptions.plist
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          sed -i '' "s|</dict>|    <key>teamID</key><string>$APPLE_TEAM_ID</string></dict>|" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath build/Engram.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Bundle CLI binaries into .app
        if: env.DEVELOPER_ID_CERT_BASE64 != ''
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/export/Engram.app"
          CLI_DIR="$APP/Contents/Resources/cli"
          AGENTS_DIR="$CLI_DIR/agents"
          mkdir -p "$CLI_DIR" "$AGENTS_DIR"

          cp .build/release/Engram "$CLI_DIR/memory"
          cp .build/release/EngramHooks "$CLI_DIR/memory-hooks"
          cp .build/release/EngramDaemon "$CLI_DIR/memory-sync"
          cp -R .build/release/Engram_EngramKit.bundle "$CLI_DIR/"
          cp -R .build/release/swift-transformers_Hub.bundle "$CLI_DIR/"
          cp -R .build/release/SwiftLM_SwiftLM.bundle "$CLI_DIR/"
          cp -R .build/release/swift-crypto_Crypto.bundle "$CLI_DIR/"
          cp agents/*.md "$AGENTS_DIR/"
          cp -R skills "$CLI_DIR/skills"
          bash scripts/package_codex_learner.sh "$CLI_DIR/codex"

          sign() {
            codesign --force --sign "Developer ID Application" \
              --keychain "$RUNNER_TEMP/signing.keychain-db" \
              --options runtime --timestamp "$1"
          }

          # Sign CLI binaries
          for bin in "$CLI_DIR/memory" "$CLI_DIR/memory-hooks" "$CLI_DIR/memory-sync"; do
            sign "$bin"
          done

          # Sign Sparkle components bottom-up (--deep is deprecated and unreliable
          # for nested XPC services — causes TeamIdentifier=not set on Installer.xpc,
          # which triggers the App Management permission prompt on macOS Ventura+)
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          for xpc in "$SPARKLE/Versions/B/XPCServices/"*.xpc; do
            sign "$xpc"
          done
          sign "$SPARKLE/Versions/B/Autoupdate"
          sign "$SPARKLE"

          # Re-codesign the .app (no --deep)
          sign "$APP"

      # Runs AFTER signing so the tarball ships Developer-ID-signed binaries.
      # Unsigned CLI binaries are dead on arrival for the daemon: launchd
      # spawns memory-sync in a context where the keychain ACL prompt cannot
      # display, so an ad-hoc/unsigned binary wedges forever inside
      # SecItemCopyMatching (0.14.1 field incident). When the cert is absent
      # (forks), the tarball still builds — just unsigned, as before.
      - name: Package CLI tarball
        run: |
          mkdir -p build/staging/agents
          if [ -d "build/export/Engram.app/Contents/Resources/cli" ]; then
            CLI="build/export/Engram.app/Contents/Resources/cli"
            cp "$CLI/memory" build/staging/memory
            cp "$CLI/memory-hooks" build/staging/memory-hooks
            cp "$CLI/memory-sync" build/staging/memory-sync
          else
            cp .build/release/Engram build/staging/memory
            cp .build/release/EngramHooks build/staging/memory-hooks
            cp .build/release/EngramDaemon build/staging/memory-sync
          fi
          cp -R .build/release/Engram_EngramKit.bundle build/staging/
          cp -R .build/release/swift-transformers_Hub.bundle build/staging/
          cp -R .build/release/SwiftLM_SwiftLM.bundle build/staging/
          cp -R .build/release/swift-crypto_Crypto.bundle build/staging/
          cp agents/*.md build/staging/agents/
          cp -R skills build/staging/skills
          bash scripts/package_codex_learner.sh build/staging/codex
          cd build/staging && tar czf ../engram-macos-arm64.tar.gz *

      - name: Package signed Codex plugin
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 -B scripts/package_codex_plugin.py \
            --plugin-source codex/plugins/engram \
            --signed-cli-dir build/export/Engram.app/Contents/Resources/cli \
            --version "${RELEASE_TAG#v}" --source-sha "$EXPECTED_SHA" \
            --expected-team "$APPLE_TEAM_ID" \
            --workflow-run "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output build/engram-codex-plugin-macos-arm64.tar.gz \
            --manifest-output build/engram-codex-plugin-manifest.json

      - name: Create DMG
        if: env.DEVELOPER_ID_CERT_BASE64 != ''
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
        run: |
          brew install create-dmg
          VERSION=${RELEASE_TAG#v}
          create-dmg \
            --volname "Engram $VERSION" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Engram.app" 150 190 \
            --app-drop-link 450 190 \
            --no-internet-enable \
            "build/Engram-${VERSION}.dmg" \
            "build/export/Engram.app"

      - name: Notarize DMG
        if: env.DEVELOPER_ID_CERT_BASE64 != ''
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=${RELEASE_TAG#v}
          DMG="build/Engram-${VERSION}.dmg"

          SUBMIT_OUT=$(xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1) || true
          echo "$SUBMIT_OUT"

          # Extract submission ID and fetch log on failure
          SUB_ID=$(echo "$SUBMIT_OUT" | grep "id:" | head -1 | awk '{print $2}')
          if ! echo "$SUBMIT_OUT" | grep -q "status: Accepted"; then
            echo "--- Notarization log ---"
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

          xcrun stapler staple "$DMG"

      - name: Generate Sparkle appcast
        if: env.SPARKLE_PRIVATE_KEY != ''
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION=${RELEASE_TAG#v}
          DMG="build/Engram-${VERSION}.dmg"

          # Download Sparkle tools
          SPARKLE_VERSION="2.8.1"
          mkdir -p /tmp/sparkle-tools
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" | tar xJ -C /tmp/sparkle-tools bin/

          # Move DMG to a staging dir for generate_appcast
          mkdir -p build/appcast_staging
          cp "$DMG" build/appcast_staging/

          # Generate appcast from the DMG
          echo "$SPARKLE_PRIVATE_KEY" | /tmp/sparkle-tools/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/jsflax/Engram/releases/download/${RELEASE_TAG}/" \
            build/appcast_staging

          # Use generated appcast
          cp build/appcast_staging/appcast.xml appcast.xml

      - name: Extract changelog for release
        id: changelog
        run: |
          VERSION=${RELEASE_TAG#v}
          BODY=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          # Write to file for multi-line handling
          echo "$BODY" > /tmp/release-body.md

      - name: Recheck exact source and emit packaged release receipt
        run: |
          # The checksum-preserving localhost Sparkle transport is build-local.
          # Restore the committed SDK mirror configuration before source checks.
          git restore --source="$EXPECTED_SHA" -- .swiftpm/configuration/mirrors.json
          python3 release-train/release_train.py candidate --version "${RELEASE_TAG#v}" --expected-sha "$EXPECTED_SHA" --output "$RUNNER_TEMP/candidate.json" --packaged
          python3 release-train/release_train.py workflow-receipt --candidate "$RUNNER_TEMP/candidate.json" --output "$RUNNER_TEMP/release-receipt.json" \
            --artifact "cli=build/engram-macos-arm64.tar.gz" --artifact "dmg=build/Engram-${RELEASE_TAG#v}.dmg" --artifact "appcast=appcast.xml" \
            --artifact "codex-plugin=build/engram-codex-plugin-macos-arm64.tar.gz" \
            --artifact "codex-plugin-manifest=build/engram-codex-plugin-manifest.json"
      # Direct dispatch runs the existing native pipeline; it does not depend on
      # a GITHUB_TOKEN-created tag triggering a second workflow.
      - name: Create GitHub Release
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then git tag "$RELEASE_TAG" "$EXPECTED_SHA"; fi
          git push origin "refs/tags/$RELEASE_TAG"
          FLAGS=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then FLAGS=(--prerelease --latest=false); fi
          # create is deliberately not an update/upsert of an existing release.
          gh release create "$RELEASE_TAG" build/engram-macos-arm64.tar.gz \
            "build/Engram-${RELEASE_TAG#v}.dmg" appcast.xml "$RUNNER_TEMP/release-receipt.json" \
            build/engram-codex-plugin-macos-arm64.tar.gz build/engram-codex-plugin-manifest.json \
            --verify-tag --target "$EXPECTED_SHA" --title "Engram ${RELEASE_TAG#v}" \
            --notes-file /tmp/release-body.md "${FLAGS[@]}"

      - name: Commit appcast.xml to main
        if: env.SPARKLE_PRIVATE_KEY != '' && !contains(env.RELEASE_TAG, '-')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add appcast.xml
          git diff --cached --quiet || (git commit -m "Update appcast.xml for ${RELEASE_TAG}" && git push origin main)

      - name: Update Homebrew formula
        if: env.TAP_TOKEN != '' && !contains(env.RELEASE_TAG, '-')
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          SHA=$(shasum -a 256 build/engram-macos-arm64.tar.gz | awk '{print $1}')
          VERSION=${RELEASE_TAG#v}

          git clone https://x-access-token:${TAP_TOKEN}@github.com/jsflax/homebrew-tap.git tap
          cd tap

          # Update version and sha256 in existing formula
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Formula/engram.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA}\"/" Formula/engram.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/engram.rb
          git diff --cached --quiet || (git commit -m "Update engram to ${VERSION}" && git push)

      - name: Notify Slack
        if: github.event_name == 'push' && success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          URL="https://github.com/${REPO}/releases/tag/${TAG}"

          # Extract changelog section and convert Markdown → Slack mrkdwn
          CHANGES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md \
            | sed '/^$/d' \
            | sed 's/^### \(.*\)/*\1*/' \
            | sed 's/\*\*\([^*]*\)\*\*/*\1*/g' \
            | sed 's/^- /• /' \
            | sed 's/`\([^`]*\)`/`\1`/g' \
            | head -20)

          # Escape for JSON
          CHANGES_ESCAPED=$(echo "$CHANGES" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read())[1:-1])')

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {\"type\": \"plain_text\", \"text\": \"✅ Engram ${TAG} released\"}
                },
                {
                  \"type\": \"section\",
                  \"text\": {\"type\": \"mrkdwn\", \"text\": \"${CHANGES_ESCAPED}\"},
                  \"accessory\": {
                    \"type\": \"button\",
                    \"text\": {\"type\": \"plain_text\", \"text\": \"View Release\"},
                    \"url\": \"${URL}\"
                  }
                }
              ]
            }"

      # Failed releases were silent (the success notifier is if: success()) —
      # announce failures too, with a link to the run.
      - name: Notify Slack (failure)
        if: github.event_name == 'push' && failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"❌ Engram ${RELEASE_TAG} release FAILED — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          fi
